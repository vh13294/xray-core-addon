name: Xray-core
version: 1.0.2
slug: xray_core
description: Xray-core VLESS + REALITY proxy server, with auto-generated keys and a QR code for your phone
url: https://github.com/vh13294/xray-core-addon
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:qrcode
panel_title: Xray QR
ports:
  443/tcp: 443
ports_description:
  443/tcp: Xray inbound (forward this port on your router)
options:
  server_address: ""
  public_port: 443
  sni: itc.edu.kh
  client_name: phone
  uuid: ""
  short_id: ""
  fingerprint: chrome
  log_level: warning
  core_config: ""
schema:
  server_address: str?
  public_port: port
  sni: str
  client_name: str
  uuid: str?
  short_id: match(^([0-9a-f]{2}){0,8}$)?
  fingerprint: list(chrome|firefox|safari|ios|android|edge|random)
  log_level: list(debug|info|warning|error|none)
  core_config: str?
